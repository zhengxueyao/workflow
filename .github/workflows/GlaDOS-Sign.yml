name: GLaDOS Checkin

on:
  schedule:
    # ⚠️ GitHub Actions 的 cron 按 UTC 解释
    # UTC 23:30 = 北京时间次日 07:30
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: GLaDOS auto checkin
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
        run: |
          echo "===== 开始签到 ====="
          curl -sS -X POST "https://glados.cloud/api/user/checkin" \
            -H "accept: application/json, text/plain, */*" \
            -H "accept-language: zh-CN,zh;q=0.9,en;q=0.8" \
            -H "content-type: application/json;charset=UTF-8" \
            -H "origin: https://glados.cloud" \
            -H "referer: https://glados.cloud/console/checkin" \
            -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36" \
            -H "Cookie: $GLADOS_COOKIE" \
            -d '{}'
          echo ""
          echo "===== 签到完成 ====="
