name: GLaDOS Checkin

on:
  schedule:
    # UTC 23:30 = 北京时间次日 07:30
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GLaDOS auto checkin
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT }}
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { setTimeout: delay } = require('node:timers/promises');

          async function main() {
            const cookie = process.env.GLADOS_COOKIE?.trim();
            const userAgent = process.env.GLADOS_USER_AGENT?.trim();
            if (!cookie || !userAgent) {
              throw new Error('请先配置 GLADOS_COOKIE 和 GLADOS_USER_AGENT Secrets');
            }

            const base = 'https://glados.cloud';
            const cookies = new Map();
            for (const part of cookie.split(';')) {
              const separator = part.indexOf('=');
              if (separator > 0) {
                cookies.set(part.slice(0, separator).trim(), part.slice(separator + 1).trim());
              }
            }

            async function request(path, body) {
              const response = await fetch(base + path, {
                method: body === undefined ? 'GET' : 'POST',
                headers: {
                  Accept: 'application/json, text/plain, */*',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                  'Content-Type': 'application/json;charset=UTF-8',
                  Origin: base,
                  Referer: base + '/console/checkin',
                  'User-Agent': userAgent,
                  Cookie: [...cookies].map(([name, value]) => `${name}=${value}`).join('; '),
                },
                body: body === undefined ? undefined : JSON.stringify(body),
                redirect: 'error',
                signal: AbortSignal.timeout(30000),
              });
              if (!response.ok) {
                throw new Error(`${path} 返回 HTTP ${response.status}`);
              }
              for (const header of response.headers.getSetCookie()) {
                const pair = header.split(';', 1)[0];
                const separator = pair.indexOf('=');
                if (separator > 0) {
                  cookies.set(pair.slice(0, separator).trim(), pair.slice(separator + 1));
                }
              }
              return response.json();
            }

            // 与网页一致：先获取一次性验证参数，再等待至少 2.5 秒。
            const challenge = await request('/api/user/checkin/challenge');
            if (challenge.code !== 0 || typeof challenge.nonce !== 'string' || !challenge.nonce) {
              throw new Error(`获取签到验证失败：${challenge.message || '未返回有效 nonce'}`);
            }
            await delay(3000);

            // 核对日期：2026-11-10；官网前端的 proof 算法可能会变化。
            const proof = createHash('sha256')
              .update(`${challenge.nonce}.glados-observe-v1`, 'utf8')
              .digest('hex');
            const result = await request('/api/user/checkin', {
              token: new URL(base).hostname,
              nonce: challenge.nonce,
              proof,
            });

            console.log(JSON.stringify({
              code: result.code,
              points: result.points,
              repeated: result.repeated,
              message: result.message,
              reason: result.reason,
            }, null, 2));

            if (result.code === 4 && result.reason === 'device-mismatch') {
              throw new Error('登录设备不一致：请用同一浏览器重新登录，并同时更新 Cookie 和 User-Agent');
            }
            if (result.code !== 0) {
              throw new Error('签到未成功，请查看上方返回信息');
            }
          }

          main().catch(error => {
            console.error(`签到失败：${error.message}`);
            process.exitCode = 1;
          });
          NODE
